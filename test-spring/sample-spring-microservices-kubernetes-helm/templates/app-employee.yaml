apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  
  source:
    repoURL: https://gitlab.example.com/root/sample-spring-microservices-kubernete-helm.git
    targetRevision: HEAD
    path: charts/employee
  
  destination:
    server: https://kubernetes.default.svc
    namespace: springcloud
  syncPolicy:
    automated: 
      prune: true 
      selfHeal: true   
    syncOptions:
      - CreateNamespace=true